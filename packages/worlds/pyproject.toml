[project]
name = "stateweaver-worlds"
version = "0.1.0"
description = "Dependency-light M2 materialized world lifecycle core"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["hypothesis>=6.130,<7", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stateweaver"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

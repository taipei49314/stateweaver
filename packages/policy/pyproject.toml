[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateweaver-policy"
version = "0.1.0"
description = "Fail-closed, deterministic policy decisions for StateWeaver typed actions"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.11,<3",
  "stateweaver-contracts==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/stateweaver"]

[tool.uv.sources]
stateweaver-contracts = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "../contracts/src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateweaver-reporting"
version = "0.1.0"
description = "Deterministic, traceable Reality publication candidates for StateWeaver."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.11,<3",
  "stateweaver-contracts==0.1.0",
  "stateweaver-evidence==0.1.0",
]

[project.urls]
Homepage = "https://github.com/taipei49314/stateweaver"
Repository = "https://github.com/taipei49314/stateweaver.git"
Issues = "https://github.com/taipei49314/stateweaver/issues"
Documentation = "https://github.com/taipei49314/stateweaver/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/stateweaver"]

[tool.uv.sources]
stateweaver-contracts = { workspace = true }
stateweaver-evidence = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "../contracts/src", "../evidence/src", "../evidence/tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateweaver-evidence"
version = "0.1.0"
description = "Offline, tamper-evident acceptance evidence collection for StateWeaver."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "stateweaver-contracts==0.1.0",
  "stateweaver-policy==0.1.0",
  "stateweaver-replay==0.1.0",
]

[project.scripts]
stateweaver-acceptance-evidence = "stateweaver.evidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stateweaver"]

[tool.uv.sources]
stateweaver-contracts = { workspace = true }
stateweaver-policy = { workspace = true }
stateweaver-replay = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

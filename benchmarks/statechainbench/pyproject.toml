[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateweaver-statechainbench"
version = "0.1.0"
description = "Deterministic equal-budget state-chain benchmark for StateWeaver."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.12,<3",
  "stateweaver-contracts==0.1.0",
  "stateweaver-search==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/statechainbench"]

[tool.uv.sources]
stateweaver-contracts = { workspace = true }
stateweaver-search = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = [
  "src",
  "../../packages/contracts/src",
  "../../packages/search/src",
]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "DTZ", "PTH", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "src",
  "../../packages/contracts/src",
  "../../packages/search/src",
]

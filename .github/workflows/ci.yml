name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked workspace
        run: uv sync --all-packages --group dev --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy packages adapters apps labs workflows benchmarks tests tools/candidate

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Produce normative acceptance JUnit inputs
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p artifacts/acceptance/junit
          date -u +%Y-%m-%dT%H:%M:%SZ > artifacts/acceptance/started-at.txt
          uv run pytest packages/contracts/tests --junitxml=artifacts/acceptance/junit/contracts.xml
          uv run pytest packages/policy/tests --junitxml=artifacts/acceptance/junit/policy.xml
          uv run pytest labs/multitenant-saas/tests --junitxml=artifacts/acceptance/junit/lab.xml
          uv run pytest \
            packages/replay/tests \
            adapters/environments/in_process_lab/tests \
            adapters/source/fastapi_sqlalchemy/tests \
            apps/cli/tests \
            packages/evidence/tests \
            packages/twin/tests \
            packages/search/tests \
            packages/compiler/tests \
            benchmarks/statechainbench/tests \
            tests/integration/observation \
            tests/integration/twin \
            tests/integration/compiler \
            --junitxml=artifacts/acceptance/junit/replay.xml

      - name: Build every workspace distribution
        if: matrix.python-version == '3.13'
        run: uv build --all-packages --out-dir dist

      - name: Smoke-test a clean wheel installation
        if: matrix.python-version == '3.13'
        run: |
          packaging_smoke="${RUNNER_TEMP}/stateweaver-packaging-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UV_OFFLINE=1 uv export --locked --no-dev --package stateweaver-cli --no-emit-local --no-editable \
            --output-file dist/runtime-requirements.txt
          uv venv "${packaging_smoke}"
          uv pip install --python "${packaging_smoke}/bin/python" --require-hashes --no-deps \
            -r dist/runtime-requirements.txt
          uv pip install --python "${packaging_smoke}/bin/python" --no-deps --no-index --find-links dist \
            dist/stateweaver_cli-*.whl \
            dist/stateweaver_adapter_docker_compose-*.whl \
            dist/stateweaver_adapter_in_process_lab-*.whl \
            dist/stateweaver_adapter_opentelemetry-*.whl \
            dist/stateweaver_compiler-*.whl \
            dist/stateweaver_contracts-*.whl \
            dist/stateweaver_evidence-*.whl \
            dist/stateweaver_lab_multitenant_saas-*.whl \
            dist/stateweaver_policy-*.whl \
            dist/stateweaver_replay-*.whl \
            dist/stateweaver_reporting-*.whl \
            dist/stateweaver_search-*.whl \
            dist/stateweaver_twin-*.whl \
            dist/stateweaver_world_workflow-*.whl \
            dist/stateweaver_worlds-*.whl
          uv pip check --python "${packaging_smoke}/bin/python"
          "${packaging_smoke}/bin/python" -c "from stateweaver.reporting import RealityPublicationManifest"
          "${packaging_smoke}/bin/stateweaver" --json doctor
          "${packaging_smoke}/bin/stateweaver" --json foundation verify
          qualification_cwd="${RUNNER_TEMP}/stateweaver-package-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${qualification_cwd}"
          (
            cd "${qualification_cwd}"
            "${packaging_smoke}/bin/stateweaver" \
              foundation qualify-package-install \
              --output "${GITHUB_WORKSPACE}/artifacts/qualification-inputs/m0/package-install.json" \
              --repository-marker "${GITHUB_SHA}" \
              --source-root "${GITHUB_WORKSPACE}"
            "${packaging_smoke}/bin/stateweaver" \
              foundation qualify-runtime-observation \
              --output "${GITHUB_WORKSPACE}/artifacts/qualification-inputs/m3/runtime-observation.json" \
              --repository-marker "${GITHUB_SHA}"
          )

      - name: Collect and verify causal acceptance proof
        if: matrix.python-version == '3.13'
        run: |
          set -o pipefail
          packaging_smoke="${RUNNER_TEMP}/stateweaver-packaging-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run stateweaver foundation collect-evidence \
            --output-root artifacts/acceptance/runs \
            --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repository-marker "${GITHUB_SHA}" \
            --started-at "$(cat artifacts/acceptance/started-at.txt)" \
            --junit-contracts artifacts/acceptance/junit/contracts.xml \
            --junit-policy artifacts/acceptance/junit/policy.xml \
            --junit-lab artifacts/acceptance/junit/lab.xml \
            --junit-replay artifacts/acceptance/junit/replay.xml \
            --package-install-receipt artifacts/qualification-inputs/m0/package-install.json \
            --runtime-observation-receipt artifacts/qualification-inputs/m3/runtime-observation.json \
            | tee artifacts/acceptance/collection.json
          "${packaging_smoke}/bin/python" - \
            "artifacts/acceptance/runs/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/qualification/registry/results.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["summary"]
          expected = {"blocked": 34, "failed": 0, "not_run": 0, "passed": 58, "required": 92}
          if summary != expected:
              raise SystemExit(f"unexpected acceptance summary: {summary!r}")
          PY
          uv run stateweaver foundation verify-evidence \
            "artifacts/acceptance/runs/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repository-marker "${GITHUB_SHA}"
          "${packaging_smoke}/bin/stateweaver" foundation verify-evidence \
            "artifacts/acceptance/runs/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repository-marker "${GITHUB_SHA}"

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload immutable acceptance proof
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-proof
          path: artifacts/acceptance
          if-no-files-found: error
          retention-days: 90

  web:
    name: Web public experience
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install uv for the fixed API server
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Install the locked API workspace
        run: uv sync --package stateweaver-api --locked

      - name: Install locked web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Check web formatting
        run: npm run format:check
        working-directory: apps/web

      - name: Lint web client
        run: npm run lint
        working-directory: apps/web

      - name: Type-check web client
        run: npm run typecheck
        working-directory: apps/web

      - name: Test web client
        run: npm test
        working-directory: apps/web

      - name: Build web client
        run: npm run build
        working-directory: apps/web

      - name: Reject high-severity web dependency advisories
        run: npm audit --audit-level=high
        working-directory: apps/web

      - name: Install locked Playwright dependencies
        run: npm ci
        working-directory: tests/e2e/public_release

      - name: Install the pinned Chromium browser
        run: npm run install:chromium
        working-directory: tests/e2e/public_release

      - name: Run the local M8 browser implementation gate
        run: npm run verify
        working-directory: tests/e2e/public_release

      - name: Retain web distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stateweaver-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 30

  attest-acceptance-proof:
    name: Attest acceptance proof provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Download the proof artifact produced by the prerequisite job.
      contents: read # Resolve repository identity for the attestation statement.
      id-token: write # Mint the short-lived OIDC identity used by actions/attest.
      attestations: write # Publish the generated repository attestation.

    steps:
      - name: Download accepted proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-proof
          path: artifacts/acceptance

      - name: Attest the exact-file proof manifest
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/acceptance/runs/*/artifact-manifest.sha256

      - name: Retain the Sigstore bundle for offline verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-proof-attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

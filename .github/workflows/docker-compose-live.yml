name: M2-M5 Docker Compose qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-m5-docker-compose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-provider-worlds:
    name: Hosted M2-M5 execution and cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked workspace
        run: uv sync --all-packages --group dev --locked

      - name: Record Docker runtime
        run: |
          mkdir -p artifacts/m2-live
          git rev-parse HEAD > artifacts/m2-live/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/m2-live/tree.txt
          git status --porcelain=v1 --untracked-files=all > artifacts/m2-live/dirty-before.txt
          test ! -s artifacts/m2-live/dirty-before.txt
          docker version > artifacts/m2-live/docker-version.txt
          docker compose version > artifacts/m2-live/compose-version.txt
          docker ps -a --no-trunc > artifacts/m2-live/containers-before.txt
          docker network ls --no-trunc > artifacts/m2-live/networks-before.txt
          docker volume ls > artifacts/m2-live/volumes-before.txt
          ps -eo pid=,ppid=,stat=,etimes=,args= > artifacts/m2-live/processes-before.txt
          awk '
            /swm2[0-9a-f]{32}/ ||
            /(^|[[:space:]\/])docker([[:space:]]|$)/ ||
            /docker-compose/ ||
            /adapters\/environments\/docker_compose\/src\/stateweaver\/adapters\/docker_compose\/(real_)?compose.yaml/
          ' artifacts/m2-live/processes-before.txt \
            > artifacts/m2-live/managed-processes-before.txt
          test ! -s artifacts/m2-live/managed-processes-before.txt
          sha256sum \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/adapter.py \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/compose.yaml \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/Dockerfile \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/runner.py \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/state_bridge.py \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/real_compose.yaml \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/RealDockerfile \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/real_postgres_init.sql \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/real_provider_bridge.py \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/MaterializedLabDockerfile \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/materialized_lab_requirements.txt \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/materialized_lab_runtime.py \
            labs/multitenant-saas/stateweaver_lab/asgi.py \
            labs/multitenant-saas/stateweaver_lab/provider_checkpoint.py \
            labs/multitenant-saas/stateweaver_lab/state.py \
            > artifacts/m2-live/source-sha256.txt

      - name: Build the fixed digest-pinned fixture
        run: |
          docker build \
            --tag stateweaver-synthetic-demo:local \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose
          docker image inspect stateweaver-synthetic-demo:local \
            > artifacts/m2-live/synthetic-image-inspect.json

      - name: Acquire and bind the real provider and materialized application images
        run: |
          set -euo pipefail
          docker compose \
            --file adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/real_compose.yaml \
            pull postgres redis rabbitmq selenium
          docker build \
            --tag stateweaver-real-provider-bridge:local \
            --file adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/RealDockerfile \
            adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose
          docker build \
            --tag stateweaver-materialized-lab:local \
            --build-arg STATEWEAVER_SOURCE_SHA=$GITHUB_SHA \
            --file adapters/environments/docker_compose/src/stateweaver/adapters/docker_compose/MaterializedLabDockerfile \
            .
          docker image inspect \
            stateweaver-real-provider-bridge:local \
            stateweaver-materialized-lab:local \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 \
            redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241 \
            rabbitmq:4-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94 \
            selenium/standalone-chromium@sha256:81c80050126f610675e40eeac529a821dc5a0d38acf26c6d44f792a6e7ea8ac5 \
            > artifacts/m2-live/real-provider-images-inspect.json

      - name: Run the explicit synthetic observation
        env:
          STATEWEAVER_RUN_DOCKER_INTEGRATION: "1"
        run: |
          uv run pytest \
            -o 'addopts=--strict-config --strict-markers -ra' \
            tests/integration/worlds/test_live_docker_compose.py \
            -m docker_integration \
            --junitxml=artifacts/m2-live/junit.xml \
            -q

      - name: Run the explicit real-provider observation
        env:
          STATEWEAVER_RUN_REAL_DOCKER_INTEGRATION: "1"
        run: |
          uv run pytest \
            -o 'addopts=--strict-config --strict-markers -ra' \
            tests/integration/worlds/test_live_real_providers.py \
            -m docker_integration \
            --junitxml=artifacts/m2-live/real-provider-junit.xml \
            -q

      - name: Run the M3-derived M4 materialized search
        env:
          STATEWEAVER_M4_REPOSITORY_MARKER: ${{ github.sha }}
          STATEWEAVER_RUN_REAL_DOCKER_INTEGRATION: "1"
        run: |
          mkdir -p artifacts/m4-live
          uv run pytest \
            -o 'addopts=--strict-config --strict-markers -ra' \
            tests/integration/worlds/test_live_materialized_search.py \
            -m docker_integration \
            --junitxml=artifacts/m4-live/junit.xml \
            -q

      - name: Compile retained M4 bytes and replay the observed chain over five clean roots
        run: |
          set -euo pipefail
          mkdir -p artifacts/m5-clean-root
          uv run stateweaver foundation qualify-observed-chain \
            --m4-receipt artifacts/m4-live/materialized-search-receipt.json \
            --repository-marker "$GITHUB_SHA" \
            --output artifacts/m5-clean-root/observed-chain-receipt.json

      - name: Execute and qualify the fixed ten-scenario actual-ASGI M5 chain
        run: |
          set -euo pipefail
          uv run stateweaver foundation qualify-materialized-chain \
            --m4-receipt artifacts/m4-live/materialized-search-receipt.json \
            --process-receipt artifacts/m5-clean-root/observed-chain-receipt.json \
            --repository-marker "$GITHUB_SHA" \
            --output artifacts/m5-clean-root/materialized-chain-replay.json

      - name: Record and enforce cleanup inventory
        if: always()
        run: |
          docker ps -a --no-trunc > artifacts/m2-live/containers-after.txt
          docker network ls --no-trunc > artifacts/m2-live/networks-after.txt
          docker volume ls > artifacts/m2-live/volumes-after.txt
          ps -eo pid=,ppid=,stat=,etimes=,args= > artifacts/m2-live/processes-after.txt
          awk '
            /swm2[0-9a-f]{32}/ ||
            /(^|[[:space:]\/])docker([[:space:]]|$)/ ||
            /docker-compose/ ||
            /adapters\/environments\/docker_compose\/src\/stateweaver\/adapters\/docker_compose\/(real_)?compose.yaml/
          ' artifacts/m2-live/processes-after.txt \
            > artifacts/m2-live/managed-processes-after.txt
          git status --porcelain=v1 --untracked-files=all > artifacts/m2-live/dirty-after.txt
          docker ps -a --filter 'name=swm2' --format '{{.Names}}' \
            > artifacts/m2-live/swm2-containers-after.txt
          docker network ls --filter 'name=swm2' --format '{{.Name}}' \
            > artifacts/m2-live/swm2-networks-after.txt
          docker volume ls --filter 'name=swm2' --format '{{.Name}}' \
            > artifacts/m2-live/swm2-volumes-after.txt
          test ! -s artifacts/m2-live/swm2-containers-after.txt
          test ! -s artifacts/m2-live/swm2-networks-after.txt
          test ! -s artifacts/m2-live/swm2-volumes-after.txt
          test ! -s artifacts/m2-live/managed-processes-after.txt
          test ! -s artifacts/m2-live/dirty-after.txt

      - name: Build hosted M2-M5 qualification
        run: |
          set -euo pipefail
          mkdir -p artifacts/hosted-qualification
          uv run stateweaver foundation qualify-hosted-docker \
            --m2-root artifacts/m2-live \
            --m4-root artifacts/m4-live \
            --m5-root artifacts/m5-clean-root \
            --repository-marker "$GITHUB_SHA" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --output artifacts/hosted-qualification/hosted-docker-qualification.json

      - name: Retain the observation inputs and result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-compose-live-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/m2-live
          if-no-files-found: error
          retention-days: 30

      - name: Retain the M4 materialized-search receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-materialized-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/m4-live
          if-no-files-found: error
          retention-days: 30

      - name: Retain the M5 observed-chain and actual-ASGI replay
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-clean-root-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/m5-clean-root
          if-no-files-found: error
          retention-days: 30

      - name: Retain the hosted M2-M5 qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-docker-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hosted-qualification/hosted-docker-qualification.json
          if-no-files-found: error
          retention-days: 90

  attest-hosted-qualification:
    name: Attest hosted M2-M5 qualification
    needs: live-provider-worlds
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read # Download this run's exact producer receipt.
      attestations: write # Publish the GitHub artifact attestation.
      contents: read # Bind the repository source identity.
      id-token: write # Request the short-lived OIDC signing identity.

    steps:
      - name: Check out the qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the producer receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hosted-docker-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-qualification

      - name: Require the exact subject and source
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          mapfile -t subjects < <(find hosted-qualification -maxdepth 1 -type f -print)
          [[ "${#subjects[@]}" -eq 1 ]]
          [[ "$(basename "${subjects[0]}")" == "hosted-docker-qualification.json" ]]

      - name: Attest the hosted qualification receipt
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: hosted-qualification/hosted-docker-qualification.json

      - name: Retain the hosted qualification attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-docker-qualification-${{ github.run_id }}-${{ github.run_attempt }}-attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stateweaver-lab-multitenant-saas"
version = "0.1.0"
description = "Deterministic, localhost-only multi-tenant SaaS lab for StateWeaver"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "pydantic>=2.12,<3",
  "starlette>=1.3.1,<1.4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<0.29",
  "httpx2>=2,<3",
  "pytest>=9.0.3,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stateweaver_lab*"]

[tool.setuptools.package-data]
stateweaver_lab = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

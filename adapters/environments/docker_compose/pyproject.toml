[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateweaver-adapter-docker-compose"
version = "0.1.0"
description = "Fail-closed Docker Compose adapters for StateWeaver's fixed synthetic and real-provider labs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.12,<3",
  "stateweaver-contracts==0.1.0",
  "stateweaver-worlds==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stateweaver"]

[tool.uv.sources]
stateweaver-contracts = { workspace = true }
stateweaver-worlds = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
pythonpath = ["src", "../../../packages/contracts/src", "../../../packages/worlds/src"]
testpaths = ["tests"]

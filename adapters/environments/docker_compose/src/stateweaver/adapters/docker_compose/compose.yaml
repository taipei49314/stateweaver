services:
  synthetic-demo:
    image: stateweaver-synthetic-demo:local
    pull_policy: never
    networks: [internal]
    volumes:
      - database:/state/database
      - cache:/state/cache
      - queue:/state/queue
      - session:/state/session
      - storage:/state/storage
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 1s
      retries: 3

networks:
  internal:
    internal: true

volumes:
  database: {}
  cache: {}
  queue: {}
  session: {}
  storage: {}

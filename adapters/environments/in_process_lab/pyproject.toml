[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateweaver-adapter-in-process-lab"
version = "0.1.0"
description = "Fail-closed deterministic replay adapter for StateWeaver's synthetic in-process lab."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.12,<3",
  "stateweaver-contracts==0.1.0",
  "stateweaver-lab-multitenant-saas==0.1.0",
  "stateweaver-policy==0.1.0",
  "stateweaver-replay==0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stateweaver"]

[tool.uv.sources]
stateweaver-contracts = { workspace = true }
stateweaver-lab-multitenant-saas = { workspace = true }
stateweaver-policy = { workspace = true }
stateweaver-replay = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "strict"
pythonpath = [
  "src",
  "../../../packages/contracts/src",
  "../../../packages/policy/src",
  "../../../packages/replay/src",
  "../../../labs/multitenant-saas",
]
testpaths = ["tests"]

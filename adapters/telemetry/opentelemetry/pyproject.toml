[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateweaver-adapter-opentelemetry"
version = "0.1.0"
description = "Offline OTLP JSON trace ingestion for StateWeaver semantic twins."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.11,<3",
  "stateweaver-contracts==0.1.0",
  "stateweaver-twin==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stateweaver"]

[tool.uv.sources]
stateweaver-contracts = { workspace = true }
stateweaver-twin = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
